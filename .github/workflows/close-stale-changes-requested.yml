name: Close Stale Changes-Requested Pull Requests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  sweep:
    name: Warn and close stale changes-requested pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Sweep open pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const WARN_DAYS = 14;
            const CLOSE_DAYS = 28;
            const WARNING_MARKER = '<!-- citrineos:stale-changes-requested-warning -->';
            const EXEMPT_LABEL = 'no-autoclose';
            const DAY_MS = 24 * 60 * 60 * 1000;

            const { owner, repo } = context.repo;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of pulls) {
              if (pr.draft) continue;
              if (pr.labels.some((label) => label.name.toLowerCase() === EXEMPT_LABEL)) continue;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              // listReviews is chronological, so the last entry per reviewer is their current state.
              const latestByReviewer = new Map();
              for (const review of reviews) {
                if (!review.user) continue;
                if (!['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) continue;
                latestByReviewer.set(review.user.id, review.state);
              }

              if (![...latestByReviewer.values()].includes('CHANGES_REQUESTED')) continue;

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) continue;

              const lastCommitAt = commits.reduce((latest, commit) => {
                const at = new Date(commit.commit.committer?.date ?? commit.commit.author.date);
                return at > latest ? at : latest;
              }, new Date(0));

              const daysSinceCommit = (Date.now() - lastCommitAt.getTime()) / DAY_MS;

              if (daysSinceCommit >= CLOSE_DAYS) {
                core.notice(`Closing #${pr.number}: changes requested, ${Math.floor(daysSinceCommit)} days without a new commit.`);
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: [
                    `Closed automatically: changes were requested on this pull request and no new commit has been`,
                    `pushed in ${CLOSE_DAYS} days (last commit ${lastCommitAt.toISOString().slice(0, 10)}).`,
                    '',
                    'Push the requested changes and reopen it, or open a new pull request.',
                  ].join('\n'),
                });
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
                continue;
              }

              if (daysSinceCommit < WARN_DAYS) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const alreadyWarned = comments.some(
                (comment) =>
                  (comment.body || '').includes(WARNING_MARKER) && new Date(comment.created_at) > lastCommitAt,
              );

              if (alreadyWarned) continue;

              core.notice(`Warning #${pr.number}: changes requested, ${Math.floor(daysSinceCommit)} days without a new commit.`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: [
                  WARNING_MARKER,
                  `Changes were requested on this pull request and no new commit has been pushed in ${WARN_DAYS} days`,
                  `(last commit ${lastCommitAt.toISOString().slice(0, 10)}).`,
                  '',
                  `It will be closed automatically if nothing is pushed within another ${CLOSE_DAYS - WARN_DAYS} days.`,
                ].join('\n'),
              });
            }
