table:
  name: Sessions
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: TenantPartner
    using:
      foreign_key_constraint_on: tenantPartnerId
  - name: RoamingPartner
    using:
      foreign_key_constraint_on: roamingPartnerId
select_permissions:
  - role: roaming_reader
    permission:
      columns:
        - id
        - ocpiSessionId
        - countryCode
        - partyId
        - startDateTime
        - endDateTime
        - kwh
        - cdrToken
        - locationId
        - evseUid
        - connectorId
        - currency
        - totalCost
        - status
        - tenantId
        - tenantPartnerId
      filter: {}
    comment: Read-only role for the Patterm timeseries_api roaming proxy (TECH-1807); SELECT only, cross-tenant (proxy filters by partner in-query).
  - role: user
    permission:
      columns:
        - id
        - ocpiSessionId
        - countryCode
        - partyId
        - startDateTime
        - endDateTime
        - kwh
        - cdrToken
        - authMethod
        - authorizationReference
        - locationId
        - evseUid
        - connectorId
        - meterId
        - currency
        - chargingPeriods
        - totalCost
        - status
        - lastUpdated
        - tenantId
        - tenantPartnerId
        - roamingPartnerId
        - createdAt
        - updatedAt
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
