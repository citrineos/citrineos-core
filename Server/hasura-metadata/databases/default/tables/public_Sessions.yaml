table:
  name: Sessions
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: TenantPartner
    using:
      foreign_key_constraint_on: tenantPartnerId
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - ocpiSessionId
        - countryCode
        - partyId
        - startDateTime
        - endDateTime
        - kwh
        - cdrToken
        - authMethod
        - authorizationReference
        - locationId
        - evseUid
        - connectorId
        - meterId
        - currency
        - chargingPeriods
        - totalCost
        - status
        - lastUpdated
        - tenantId
        - tenantPartnerId
        - createdAt
        - updatedAt
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
