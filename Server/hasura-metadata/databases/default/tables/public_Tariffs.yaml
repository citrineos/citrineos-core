table:
  name: Tariffs
  schema: public
object_relationships:
  - name: Connector
    using:
      foreign_key_constraint_on: connectorId
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: TenantPartner
    using:
      foreign_key_constraint_on: tenantPartnerId
  - name: RoamingPartner
    using:
      foreign_key_constraint_on: roamingPartnerId
array_relationships:
  - name: MeterValues
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: MeterValues
          schema: public
  - name: Transactions
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: Transactions
          schema: public
  - name: ConnectorTariffsOcpiPartner
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: ConnectorTariffs
          schema: public
  - name: TariffElements
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: TariffElements
          schema: public
select_permissions:
  - role: roaming_reader
    permission:
      columns:
        - id
        - pricePerKwh
        - currency
        - stationId
        - ocpiTariffId
        - tenantId
        - tenantPartnerId
      filter: {}
    comment: Read-only role for the Patterm timeseries_api roaming proxy (TECH-1807); SELECT only, cross-tenant (proxy filters by partner in-query).
  - role: user
    permission:
      columns:
        - currency
        - stationId
        - id
        - ocpiTariffId
        - tenantId
        - tenantPartnerId
        - roamingPartnerId
        - authorizationAmount
        - paymentFee
        - pricePerKwh
        - pricePerMin
        - pricePerSession
        - taxRate
        - tariffAltText
        - tariffType
        - tariffAltUrl
        - minPrice
        - maxPrice
        - energyMix
        - startDateTime
        - endDateTime
        - createdAt
        - updatedAt
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      columns:
        - currency
        - stationId
        - ocpiTariffId
        - tenantId
        - tenantPartnerId
        - authorizationAmount
        - paymentFee
        - pricePerKwh
        - pricePerMin
        - pricePerSession
        - taxRate
        - tariffAltText
        - tariffType
        - tariffAltUrl
        - minPrice
        - maxPrice
        - energyMix
        - startDateTime
        - endDateTime
        - createdAt
        - updatedAt
      check:
        tenantId:
          _eq: x-hasura-tenant-id