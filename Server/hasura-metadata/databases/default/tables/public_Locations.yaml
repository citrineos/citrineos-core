table:
  name: Locations
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: OwnerTenantPartner
    using:
      foreign_key_constraint_on: ownerTenantPartnerId
  - name: RoamingPartner
    using:
      foreign_key_constraint_on: roamingPartnerId
array_relationships:
  - name: ChargingStations
    using:
      foreign_key_constraint_on:
        column: locationId
        table:
          name: ChargingStations
          schema: public
  - name: Transactions
    using:
      foreign_key_constraint_on:
        column: locationId
        table:
          name: Transactions
          schema: public
select_permissions:
  - role: roaming_reader
    permission:
      columns:
        - id
        - name
        - address
        - city
        - postalCode
        - country
        - coordinates
        - openingHours
        - tenantId
      filter: {}
    comment: Read-only role for the Patterm timeseries_api roaming proxy (TECH-1807); SELECT only, cross-tenant (proxy filters by partner in-query).
  - role: user
    permission:
      columns:
        - address
        - city
        - country
        - name
        - postalCode
        - state
        - id
        - tenantId
        - ownerTenantPartnerId
        - createdAt
        - updatedAt
        - coordinates
        - publishAllowedTo
        - energyMix
        - images
        - directions
        - operator
        - suboperator
        - owner
        - chargingWhenClosed
        - relatedLocations
        - ocpiId
        - roamingPartnerId
        - deletedAt
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
