table:
  name: Cdrs
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: TenantPartner
    using:
      foreign_key_constraint_on: tenantPartnerId
  - name: RoamingPartner
    using:
      foreign_key_constraint_on: roamingPartnerId
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - ocpiCdrId
        - countryCode
        - partyId
        - startDateTime
        - endDateTime
        - sessionId
        - cdrToken
        - authMethod
        - authorizationReference
        - cdrLocation
        - meterId
        - currency
        - tariffs
        - chargingPeriods
        - signedData
        - totalCost
        - totalFixedCost
        - totalEnergy
        - totalEnergyCost
        - totalTime
        - totalTimeCost
        - totalParkingTime
        - totalParkingCost
        - totalReservationCost
        - remark
        - invoiceReferenceId
        - credit
        - creditReferenceId
        - homeChargingCompensation
        - lastUpdated
        - tenantId
        - tenantPartnerId
        - roamingPartnerId
        - createdAt
        - updatedAt
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""