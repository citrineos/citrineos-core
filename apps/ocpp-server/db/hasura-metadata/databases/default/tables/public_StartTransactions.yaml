table:
  name: StartTransactions
  schema: public
object_relationships:
  - name: Connector
    using:
      foreign_key_constraint_on: connectorDatabaseId
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: Transaction
    using:
      manual_configuration:
        remote_table:
          name: Transactions
          schema: public
        column_mapping:
          transactionDatabaseId: id
          transactionCreatedAt: createdAt
insert_permissions:
  - role: user
    permission:
      check:
        tenantId:
          _eq: x-hasura-tenant-id
      columns: "*"
    comment: ""
select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      check:
        tenantId:
          _eq: x-hasura-tenant-id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
    comment: ""
