table:
  name: StopTransactions
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: Transaction
    using:
      manual_configuration:
        remote_table:
          name: Transactions
          schema: public
        column_mapping:
          transactionDatabaseId: id
          transactionCreatedAt: createdAt
array_relationships:
  - name: MeterValues
    using:
      manual_configuration:
        remote_table:
          name: MeterValues
          schema: public
        column_mapping:
          id: stopTransactionDatabaseId
          transactionCreatedAt: transactionCreatedAt
select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""
